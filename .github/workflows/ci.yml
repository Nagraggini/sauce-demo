name: Java Selenium CI

on:
    push:
        branches:
            - main
        paths-ignore:
            - "README.md" # Ez megakadályozza az újra-futtatást a badge frissítés miatt
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: write
    actions: write
    pages: write # Ez is kell a Pages-hez
    id-token: write # Ez is szükséges a biztonságos deploy-hoz

jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
            # =========================
            # 1. Checkout
            # =========================
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # =========================
            # 2. Java 21 setup
            # =========================
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: 21
                  distribution: temurin
                  cache: "maven"
                  cache-dependency-path: "**/pom.xml"

            # =========================
            # 3. Run Tests & Generate JaCoCo Report
            # =========================
            - name: Make mvnw executable
              run: chmod +x mvnw

            - name: Run Tests and Coverage
              env:
                  USERNAME: ${{ secrets.USERNAME }}
                  PASSWORD: ${{ secrets.PASSWORD }}
                  WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}
                  BASE_URL: ${{ secrets.BASE_URL }}
              # -DCI=true-val átadjuk a paramétert.
              run: ./mvnw -B clean test -DCI=true

            # =========================
            # 4. Generate JaCoCo Badges (Directly into README)
            # =========================
            - name: Generate JaCoCo Badge
              id: jacoco
              uses: cicirello/jacoco-badge-generator@v2
              with:
                  generate-branches-badge: true
                  jacoco-csv-file: target/site/jacoco/jacoco.csv

            # =========================
            # 5. Commit and Push the README back to repo
            # =========================
            - name: Commit and push badges
              if: ${{ github.event_name == 'push' }}
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add README.md
                  git diff --staged --quiet || git commit -m "chore: update jacoco coverage badges in README"
                  git push

            # =========================
            # 6. Test reports artifact upload
            # =========================
            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: surefire-reports
                  path: target/surefire-reports

            # =========================
            # 7. Generate Allure Report
            # =========================
            - name: Generate Allure Report
              run: ./mvnw allure:report

            # =========================
            # 8. Prepare GitHub Pages folder
            # =========================
            - name: Prepare GitHub Pages folder
              run: |
                  rm -rf public
                  mkdir -p public
                  cp -r target/site/jacoco public/jacoco
                  cp -r target/site/allure-maven-plugin public/allure-report 2>/dev/null || true
                  cp -r target/site/allure-report public/allure-report 2>/dev/null || true
                  echo "<h1>Reports</h1><a href='jacoco/index.html'>JaCoCo</a><br><a href='allure-report/index.html'>Allure</a>" > public/index.html

            # =========================
            # 9. Deploy to GitHub Pages
            # =========================
            - name: Deploy to GitHub Pages
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: public
                  branch: gh-pages
