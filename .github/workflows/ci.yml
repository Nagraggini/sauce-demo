name: Java Selenium CI

on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: write
    pages: write # Ez is kell a Pages-hez
    id-token: write # Ez is szükséges a biztonságos deploy-hoz

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            # =========================
            # 1. Checkout
            # =========================
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # =========================
            # 2. Java 21 setup
            # =========================
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: 21
                  distribution: temurin
                  cache: "maven"
                  cache-dependency-path: "**/pom.xml"

            # =========================
            # 3. Run Tests & Generate JaCoCo Report
            # =========================
            - name: Run Tests and Coverage
              env:
                  USERNAME: ${{ secrets.USERNAME }}
                  PASSWORD: ${{ secrets.PASSWORD }}
                  WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}
                  BASE_URL: ${{ secrets.BASE_URL }}
              run: mvn -B clean verify

            # =========================
            # 4. Generate JaCoCo Badges (Directly into README)
            # =========================
            - name: Generate JaCoCo Badge
              id: jacoco
              uses: cicirello/jacoco-badge-generator@v2
              with:
                  generate-branches-badge: true
                  jacoco-csv-file: target/site/jacoco/jacoco.csv

            # =========================
            # 5. Commit and Push the README back to repo
            # =========================
            - name: Commit and push badges
              if: ${{ github.event_name == 'push' }}
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add README.md
                  git diff --staged --quiet || git commit -m "chore: update jacoco coverage badges in README"
                  git push

            # =========================
            # 6. Test reports artifact upload
            # =========================
            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: surefire-reports
                  path: target/surefire-reports

            # =========================
            # 7. Deploy JaCoCo Report to GitHub Pages
            # =========================
            - name: Deploy JaCoCo Report to GitHub Pages
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: target/site/jacoco # A mappa, amit publikálni szeretnél
                  branch: gh-pages
